name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, tests, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: evergent
          POSTGRES_PASSWORD: evergent
          POSTGRES_DB: evergent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evergent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijklmnop
      DATABASE_URL: postgresql+asyncpg://evergent:evergent@localhost:5432/evergent
      REDIS_URL: redis://localhost:6379/0
      # The suite needs Docker for the sandbox tests; the runner has it.
      SANDBOX_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Seed
        run: python -m scripts.seed
      - name: OpenAPI document is current
        run: python scripts/export_openapi.py --check
      - name: S3-compatible store for the live storage tests
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:3.80 server -s3 -s3.port=8333 -dir=/data
          for _ in $(seq 60); do curl -sf -o /dev/null localhost:8333 && break; sleep 2; done
      - name: Tests (including pgvector and S3, against throwaway stores)
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://evergent:evergent@localhost:5432/evergent_test
          TEST_S3_ENDPOINT: http://127.0.0.1:8333
        run: |
          PGPASSWORD=evergent createdb -h localhost -U evergent evergent_test
          pytest

  frontend:
    name: Frontend — lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the backend's OpenAPI document
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run
        working-directory: frontend
        env:
          CI: "1"
          E2E_PYTHON: python
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  images:
    name: Production images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: evergent-backend:ci
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: evergent-frontend:ci
      - name: Compose file is valid
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s/^SECRET_KEY=.*/SECRET_KEY=ci-only-secret-key-0123456789-abcdefghijklmnop/; s/^ENCRYPTION_KEY=.*/ENCRYPTION_KEY=ci/' .env
          docker compose config --quiet
