# Render Blueprint for the backend API and its Key Value instance, on Render's
# free plan. Postgres is on Neon's free plan, because Render deletes free
# databases after 30 days. The frontend runs on Vercel (frontend/vercel.json).
# Setup, step by step: infrastructure/deployment/RENDER_AND_VERCEL.md
#
# Keep this region beside the Neon database and the Vercel function region in
# frontend/vercel.json: every page request crosses both hops.

services:
  - type: web
    name: evergent-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    # Free: sleeps after 15 idle minutes and takes about a minute to wake.
    # Change to 0.5c-512mb to keep it always on.
    plan: free
    healthCheckPath: /health
    # Migrations run as the container starts rather than as a pre-deploy step,
    # which works on every plan. A script, because Render does not document
    # how it splits a command line, so quotes and && are best kept out of it.
    dockerCommand: sh scripts/start.sh
    # Deploy a commit only after its GitHub checks (CI) have passed.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: ENVIRONMENT
        value: production
      # The image serves on 8000, and Render routes to PORT.
      - key: PORT
        value: "8000"
      # Neon's connection string, as copied from its dashboard — asked for once.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: evergent-kv
          property: connectionString
      # Generated once, when the Blueprint is first applied. Never regenerate
      # ENCRYPTION_KEY: provider keys saved in the app are encrypted with it.
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Copy this value into the Vercel project's FRONTEND_PROXY_SECRET.
      - key: FRONTEND_PROXY_SECRET
        generateValue: true
      # The Vercel URL, e.g. https://evergent.vercel.app — asked for once.
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Optional "Continue with Google". Redirect URI to register in Google
      # Cloud: <FRONTEND_URL>/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Workflows run inside the API, so there is no worker to pay for. A
      # deploy, or the instance going to sleep, interrupts running ones; they
      # are marked paused and resume from the UI.
      - key: EXECUTION_BACKEND
        value: inline
      # The container's disk is wiped on every deploy, so attachments live in
      # Postgres (and in its backups).
      - key: STORAGE_BACKEND
        value: database
      # No Docker inside Render containers: generated tests are reported as
      # "not run", as in the Compose stack.
      - key: SANDBOX_ENABLED
        value: "false"

  - type: keyvalue
    name: evergent-kv
    region: singapore
    # Holds rate-limit windows and live-event fan-out, nothing that must
    # survive a restart, so the free instance is enough.
    plan: free
    # Reachable only from Render services in this region.
    ipAllowList: []
