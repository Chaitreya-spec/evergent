# The services the app depends on (plus a mail catcher), for running the backend and frontend
# directly on your machine during development. Bound to 127.0.0.1: never
# reachable from the network.
#
#   docker compose -f docker-compose.dev.yml up -d

name: evergent-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: evergent
      POSTGRES_PASSWORD: evergent
      POSTGRES_DB: evergent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evergent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the backend sends, so password reset and address
  # verification work locally. Inbox: http://localhost:8025
  # Backend .env: SMTP_HOST=127.0.0.1  SMTP_PORT=1025  SMTP_STARTTLS=false
  mailpit:
    image: axllent/mailpit:v1.21.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # An S3-compatible object store, to try STORAGE_BACKEND=s3 locally.
  # Opt-in: docker compose -f docker-compose.dev.yml --profile s3 up -d s3
  # Backend .env: STORAGE_BACKEND=s3  S3_BUCKET=evergent  S3_ENDPOINT_URL=http://127.0.0.1:8333
  #               S3_REGION=us-east-1  S3_ACCESS_KEY_ID=dev  S3_SECRET_ACCESS_KEY=dev
  s3:
    image: chrislusf/seaweedfs:3.80
    profiles: ["s3"]
    command: server -s3 -s3.port=8333 -dir=/data -master.volumeSizeLimitMB=64
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - dev_s3:/data

volumes:
  dev_postgres:
  dev_s3:
